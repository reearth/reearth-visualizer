name: Build Workbench Nightly

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '!web/docs/**'
      - '.github/workflows/build_workbench.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build from (branch, tag, or commit)'
        required: false
        default: 'main'

concurrency:
  group: workbench-nightly
  cancel-in-progress: true

jobs:
  build-nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.1 --activate

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build workbench
        run: yarn build:workbench
        env:
          NODE_ENV: production
          REEARTH_WORKBENCH_VERSION: nightly
          REEARTH_WORKBENCH_COMMIT: ${{ steps.checkout.outputs.commit }}

      - name: Verify manifest
        run: cat dist-workbench/workbench-manifest.json

      - name: Create release archive
        run: |
          cd dist-workbench
          tar -czf ../reearth-viz-workbench_nightly.tar.gz .
          cd ..
          sha256sum reearth-viz-workbench_nightly.tar.gz > reearth-viz-workbench_nightly.tar.gz.sha256

      - name: Release nightly
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          makeLatest: false
          prerelease: true
          omitNameDuringUpdate: true
          name: "Workbench Nightly"
          tag: workbench-nightly
          commit: ${{ steps.checkout.outputs.commit }}
          artifacts: |
            web/reearth-viz-workbench_nightly.tar.gz
            web/reearth-viz-workbench_nightly.tar.gz.sha256
          body: |
            Nightly build of Re:Earth Visualizer Workbench for plugin development.

            **⚠️ Development Build**: This is an automatically generated nightly build. Use stable releases for production.

            **Usage**: Download and extract to serve locally with your plugin development CLI.

            **Version**: `nightly` (built from commit ${{ steps.checkout.outputs.commit }})
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workbench-nightly
          path: |
            web/reearth-viz-workbench_nightly.tar.gz
            web/reearth-viz-workbench_nightly.tar.gz.sha256
            web/dist-workbench/workbench-manifest.json
          retention-days: 30
