name: Stage
on:
  workflow_dispatch:
jobs:
  stage:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: git config
        env:
          GH_APP_ID: ${{ vars.GH_APP_ID }}
          GH_APP_USER: ${{ vars.GH_APP_USER }}
        run: |
          git config --global user.name ${GH_APP_USER}
          git config user.email ${GH_APP_ID}+${GH_APP_USER}[bot]@users.noreply.github.com
          git config --global pull.rebase false
      - name: Checkout release branch
        run: git switch release || git switch -c release
      - name: Merge main branch to release branch
        run: git merge -X theirs main
      - name: Git push
        run: git push origin release

  promote-to-rc:
    needs: stage
    uses: ./.github/workflows/promote_images.yml
    with:
      from_tag: nightly
      to_tag: rc
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
