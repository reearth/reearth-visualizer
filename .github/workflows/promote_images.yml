# Retags an already-built image under a new tag via a registry-side manifest
# copy (no rebuild, no pull/push of image layers). Used by stage.yml and
# release.yml to promote nightly -> rc -> a version tag without re-running CI.
name: promote-images
on:
  workflow_call:
    inputs:
      from_tag:
        type: string
        required: true
      to_tag:
        type: string
        required: true
    secrets:
      DOCKERHUB_TOKEN:
        required: true
      DOCKERHUB_USERNAME:
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Retag web image
        env:
          FROM_TAG: ${{ inputs.from_tag }}
          TO_TAG: ${{ inputs.to_tag }}
        run: |
          docker buildx imagetools create \
            -t "reearth/reearth-visualizer-web:${TO_TAG}" \
            "reearth/reearth-visualizer-web:${FROM_TAG}"
      - name: Retag server image
        env:
          FROM_TAG: ${{ inputs.from_tag }}
          TO_TAG: ${{ inputs.to_tag }}
        run: |
          docker buildx imagetools create \
            -t "reearth/reearth-visualizer-api:${TO_TAG}" \
            "reearth/reearth-visualizer-api:${FROM_TAG}"
