name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        required: false
        description: 'Next version (Use "custom" for specific versions like beta)(NOTE: Switch the branch to "release"!)'
        type: choice
        default: minor
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        required: false
        description: 'Custom version (e.g., 1.0.0-beta.1.0) - Only used when version is set to "custom"'
        type: string
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up git config
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global pull.rebase false
      - name: Sync release branch
        # A re-run checks out the commit the run first started from, which is
        # behind if an earlier attempt already pushed. Fast-forwarding to the
        # current tip makes a re-run behave like a fresh dispatch. Tags come
        # along so the tag check below sees what is already on the remote.
        # ff-only on purpose: if the branch has diverged, stop and let someone
        # look rather than quietly discarding whatever is here.
        run: |
          git fetch --tags --force origin release
          git switch release
          git merge --ff-only origin/release
      - id: changelog
        name: Generate CHANGELOG
        uses: reearth/changelog-action@86cb9d7a3727f3cb6afe36a1536fad61e9775287 # main
        with:
          version: ${{ github.event.inputs.version == 'custom' && github.event.inputs.custom_version || github.event.inputs.version }}
          repo: ${{ github.repository }}
          latest: CHANGELOG_latest.md
      - id: version
        name: Determine version
        env:
          RAW_VERSION: ${{ github.event.inputs.version == 'custom' && github.event.inputs.custom_version || steps.changelog.outputs.version }}
        run: echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Upload latest CHANGELOG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog-${{ steps.version.outputs.version }}
          path: CHANGELOG_latest.md
      - id: commit
        name: Commit & push to release
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          rm CHANGELOG_latest.md
          git add CHANGELOG.md
          # The changelog action is idempotent, so a re-run after a partial
          # failure regenerates an identical CHANGELOG.md and leaves nothing to
          # commit. That means the work is already done, not that it failed.
          if git diff --cached --quiet; then
            echo "CHANGELOG.md is already committed, skipping commit"
          else
            git commit -m "$TAG"
          fi
          # Reuse an existing tag, but only where it already points at this
          # commit. Anything else is a real problem and should stop the release.
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            # Peel to the commit, so an annotated tag created during a manual
            # recovery compares as equal instead of resolving to its tag object.
            if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse "HEAD^{commit}")" ]; then
              echo "::error::$TAG already exists and points at a different commit"
              exit 1
            fi
            echo "tag $TAG already exists at this commit, skipping tag"
          else
            git tag "$TAG"
          fi
          # Already-pushed refs make this a no-op rather than a failure.
          git push --atomic origin release "$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Commit & push to main
        run: |
          git switch main
          git pull --ff-only origin main
          if git diff --quiet release -- CHANGELOG.md; then
            echo "main already has the release CHANGELOG, skipping cherry-pick"
          else
            git cherry-pick release
          fi
          # This push has failed with an intermittent 500 from GitHub, so retry
          # once, which also covers someone else pushing to main in between. If
          # the second attempt fails too, fail the job rather than keep trying:
          # the changelog can be brought to main with an ordinary pull request,
          # and a real problem is better seen straight away.
          if ! git push origin main; then
            echo "push to main failed, retrying once"
            sleep 5
            git pull --rebase origin main
            git push origin main
          fi

  promote-to-version:
    needs: release
    uses: ./.github/workflows/promote_images.yml
    with:
      from_tag: rc
      to_tag: ${{ needs.release.outputs.version }}
    secrets: inherit

  publish-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.release.outputs.version }}
      ARTIFACT: reearth-web_v${{ needs.release.outputs.version }}.tar.gz
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Fetch reearth-web release
        uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7 # 1.1.2
        with:
          version: tags/nightly
          file: reearth-web_nightly.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename artifact
        run: mv reearth-web_nightly.tar.gz "$ARTIFACT"
      - name: Download latest changelog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changelog-${{ needs.release.outputs.version }}
      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          artifacts: ${{ env.ARTIFACT }}
          artifactContentType: application/gzip
          commit: ${{ needs.release.outputs.sha }}
          name: ${{ env.TAG }}
          tag: ${{ env.TAG }}
          bodyFile: CHANGELOG_latest.md
