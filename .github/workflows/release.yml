name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        required: false
        description: 'Next version (Use "custom" for specific versions like beta)(NOTE: Switch the branch to "release"!)'
        type: choice
        default: minor
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        required: false
        description: 'Custom version (e.g., 1.0.0-beta.1.0) - Only used when version is set to "custom"'
        type: string
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up git config
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global pull.rebase false
      - name: Check whether this release was already cut
        id: gate
        # The tag is the checkpoint for the whole release. For a custom version
        # the tag is known before any work runs, so a re-run can tell "already
        # cut, only reconcile main" from a first run. This also stops the
        # changelog action from aborting a re-run: it throws when its tag already
        # exists, so when the tag is present we skip it rather than let it fail.
        run: |
          git fetch --tags --force origin
          if [ "${{ github.event.inputs.version }}" = "custom" ] \
            && git rev-parse -q --verify "refs/tags/v${{ github.event.inputs.custom_version }}" > /dev/null; then
            echo "cut=true" >> "$GITHUB_OUTPUT"
            echo "tag v${{ github.event.inputs.custom_version }} already exists; skipping the cut, only reconciling main"
          else
            echo "cut=false" >> "$GITHUB_OUTPUT"
          fi
      - id: changelog
        name: Generate CHANGELOG
        if: steps.gate.outputs.cut != 'true'
        uses: reearth/changelog-action@86cb9d7a3727f3cb6afe36a1536fad61e9775287 # main
        with:
          version: ${{ github.event.inputs.version == 'custom' && github.event.inputs.custom_version || github.event.inputs.version }}
          repo: ${{ github.repository }}
          latest: CHANGELOG_latest.md
      - id: version
        name: Determine version
        # On a fresh cut the version comes from the changelog action (authoritative
        # for the patch/minor/major path); on a re-run that skipped it, from the
        # custom input.
        env:
          RAW_VERSION: ${{ github.event.inputs.version == 'custom' && github.event.inputs.custom_version || steps.changelog.outputs.version }}
        run: echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Upload latest CHANGELOG
        if: steps.gate.outputs.cut != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog-${{ steps.version.outputs.version }}
          path: CHANGELOG_latest.md
      - name: Commit & tag release
        if: steps.gate.outputs.cut != 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          rm CHANGELOG_latest.md
          git add CHANGELOG.md
          git commit -m "$TAG"
          git tag "$TAG"
          # Atomic: the branch and tag land together or not at all, so a failure
          # here never leaves a tag without its changelog commit. The tag is the
          # last thing pushed, so nothing after it can strand a half-done release.
          git push --atomic origin release "$TAG"
      - id: sha
        name: Resolve release commit
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: echo "sha=$(git rev-parse "$TAG^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Reconcile main
        # Runs last on every attempt, so main is brought up to the release
        # changelog whether this run cut the release or an earlier attempt did.
        # A no-op when main already has it, so a re-run is safe; if this push is
        # the step that fails, re-running reaches it again through the gate above.
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git fetch --force origin main release
          git switch -C main origin/main
          if git diff --quiet origin/release -- CHANGELOG.md; then
            echo "main already has the release CHANGELOG, nothing to reconcile"
          else
            git checkout origin/release -- CHANGELOG.md
            git commit -m "$TAG" -- CHANGELOG.md
            git push origin main
          fi

  promote-to-version:
    needs: release
    uses: ./.github/workflows/promote_images.yml
    with:
      from_tag: rc
      to_tag: ${{ needs.release.outputs.version }}
    secrets: inherit

  publish-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.release.outputs.version }}
      ARTIFACT: reearth-web_v${{ needs.release.outputs.version }}.tar.gz
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Fetch reearth-web release
        uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7 # 1.1.2
        with:
          version: tags/nightly
          file: reearth-web_nightly.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename artifact
        run: mv reearth-web_nightly.tar.gz "$ARTIFACT"
      - name: Download latest changelog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changelog-${{ needs.release.outputs.version }}
      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          artifacts: ${{ env.ARTIFACT }}
          artifactContentType: application/gzip
          commit: ${{ needs.release.outputs.sha }}
          name: ${{ env.TAG }}
          tag: ${{ env.TAG }}
          bodyFile: CHANGELOG_latest.md
