openapi: 3.0.3
info:
  title: Re:Earth Visualizer API
  version: 1.0.0
  description: |
    A REST API for clients outside the web app, such as the Re:Earth CLI.

    It runs as its own service (`REEARTH_VISUALIZER_PUBLICAPI_ACTIVE=true`), so
    its traffic never reaches the main Visualizer server, but it uses the same
    usecases and database.

    Every request needs a Re:Earth access token in `Authorization: Bearer`.
    The token is verified by reearth-accounts, and each request runs with the
    permissions of that user in each workspace.

    Field names are part of the contract: rename nothing, only add.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Projects
  - name: Plugins
  - name: Stories
paths:
  /workspaces/{workspaceId}/projects:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
    get:
      operationId: listProjects
      summary: List the projects of a workspace
      description: |
        Lists the projects of a workspace, most recently updated first by default. Projects in the trash
        are left out unless `deleted=true`. A workspace you cannot read returns
        an empty list.
      tags: [Projects]
      parameters:
        - name: keyword
          in: query
          description: Only projects whose name contains this text. Ignored with `starred` or `deleted`.
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order. Ignored with `starred` or `deleted`.
          schema:
            $ref: "#/components/schemas/ProjectSort"
        - name: starred
          in: query
          description: Only starred projects.
          schema:
            type: boolean
        - name: deleted
          in: query
          description: Only projects in the trash.
          schema:
            type: boolean
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      summary: Create a project
      description: Creates a project together with its scene, so that it can be opened in the editor and plugins can be installed right away.
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: The created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /workspaces/{workspaceId}/projects/import:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
    post:
      operationId: importProject
      summary: Upload a project zip to import, one chunk per request
      description: |
        Imports a project export zip into the workspace, using the web app's
        chunked upload. Servers that import through GCS instead (as the hosted
        service does) answer 501 `unsupported`; use importProjectUploadUrl there. Split the zip into chunks of exactly 16 MiB (the last
        one may be shorter) and send them in order, all with the same
        `file_id`. The first chunk creates the project, with `importStatus`
        `UPLOADING`, and every response returns its ID. After the last chunk
        the import runs in the background: poll `GET /projects/{projectId}`
        until `importStatus` is `SUCCESS` or `FAILED`.
      tags: [Projects]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file_id, chunk_num, total_chunks, file]
              properties:
                file_id:
                  description: Identifies the upload; letters, digits, '_' and '-', up to 128 characters.
                  type: string
                chunk_num:
                  description: Zero-based chunk index.
                  type: integer
                total_chunks:
                  type: integer
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The chunk was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportChunkResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
  /workspaces/{workspaceId}/projects/import-url:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
    post:
      operationId: importProjectUploadUrl
      summary: Get a URL to upload a project zip to import
      description: |
        Starts an import the way the hosted web app does: creates the project,
        with `importStatus` `UPLOADING`, and returns a signed storage URL. PUT
        the zip to `uploadUrl` with the given `contentType` before `expiresAt`;
        the upload starts the import in the background. Poll
        `GET /projects/{projectId}` until `importStatus` is `SUCCESS` or
        `FAILED`. Servers that use chunked upload instead answer 501
        `unsupported`; use importProject there.
      tags: [Projects]
      responses:
        "201":
          description: The project and where to upload the zip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportUploadResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: getProject
      summary: Get a project
      tags: [Projects]
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProject
      summary: Update a project
      description: Changes only the fields that are given.
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProject
      summary: Move a project to the trash, or delete it permanently
      description: |
        Moves the project to the trash, as the web app does. With
        `permanent=true` the project and its scene are deleted for good; this
        is only allowed for a project that is already in the trash.
      tags: [Projects]
      parameters:
        - name: permanent
          in: query
          schema:
            type: boolean
      responses:
        "204":
          description: Moved to the trash, or deleted
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /projects/{projectId}/restore:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      operationId: restoreProject
      summary: Restore a project from the trash
      description: |
        Moves a project out of the trash, as the web app does. Restoring a
        project that is not in the trash changes nothing.
      tags: [Projects]
      responses:
        "200":
          description: The restored project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /projects/{projectId}/publish:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      operationId: publishProject
      summary: Publish or unpublish a project
      description: |
        Sets the publishment status, as the web app's publish dialog does.
        `public` and `limited` both publish the project and upload its latest
        state; `limited` asks search engines not to index the page.
        `private` unpublishes it.

        `alias` sets the published alias, which names the published URL. It
        is kept when omitted, and a new project gets `c-<scene ID>`.
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishProjectRequest"
      responses:
        "200":
          description: The project, with its published URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishProjectResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /projects/{projectId}/story/publish:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      operationId: publishStory
      summary: Publish or unpublish a project's story
      description: |
        Publishes the project's story separately from the project, with its
        own alias and URL. A project has one story; a project with several
        answers 409. The status and alias work as for publishProject, and a
        story published for the first time gets `s-<story ID>`.
      tags: [Stories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishProjectRequest"
      responses:
        "200":
          description: The story, with its published URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishStoryResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /projects/{projectId}/export:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: exportProject
      summary: Download a project as a zip
      description: |
        Builds the project's export zip, the same file the web app exports,
        and returns it. It holds the project, its scene, plugins and assets,
        and can be imported again. Large projects take a while to build.
      tags: [Projects]
      responses:
        "200":
          description: The export zip
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /projects/{projectId}/plugins:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: listPlugins
      summary: List the plugins installed in a project
      description: Includes the built-in Re:Earth plugin, marked with `system`.
      tags: [Plugins]
      responses:
        "200":
          description: The installed plugins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: uploadPlugin
      summary: Upload a plugin and install it in a project
      description: |
        Send the plugin zip as the body (`application/zip`, up to 10 MB), or
        `{"url": "..."}` to have the server download it. The zip must have
        `reearth.yml` at its root and a `<extension-id>.js` per extension.

        Uploading the same plugin ID and version again replaces it. A new
        version upgrades the installed one: the project switches to it and the
        old version is removed, so its plugin ID stops existing.
      tags: [Plugins]
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              $ref: "#/components/schemas/UploadPluginRequest"
      responses:
        "201":
          description: The installed plugin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /projects/{projectId}/plugins/{pluginId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - name: pluginId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: uninstallPlugin
      summary: Uninstall a plugin from a project
      tags: [Plugins]
      responses:
        "204":
          description: Uninstalled
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    cursor:
      name: cursor
      in: query
      description: The `nextCursor` of the previous page.
      schema:
        type: string
  responses:
    Error:
      description: The request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              description: A stable, machine-readable code.
              type: string
              enum: [invalid_input, unauthorized, permission_denied, not_found, conflict, unsupported, internal]
            message:
              type: string
    ProjectSort:
      type: string
      enum: [updatedAt, -updatedAt, name, -name]
      default: -updatedAt
      description: The field to sort by; a leading `-` sorts in descending order.
    Visibility:
      type: string
      enum: [public, private]
    PublishmentStatus:
      type: string
      enum: [public, limited, private]
    Project:
      type: object
      required:
        - id
        - workspaceId
        - name
        - description
        - visibility
        - starred
        - archived
        - deleted
        - publishmentStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        workspaceId:
          type: string
        sceneId:
          description: The scene of the project. Plugins are installed into it.
          type: string
        name:
          type: string
        description:
          type: string
        alias:
          description: The project alias used in the editor URL.
          type: string
        publishedAlias:
          description: The alias in the published URL. Set once the project has been published.
          type: string
        importStatus:
          description: Set on a project created by an import.
          type: string
          enum: [UPLOADING, PROCESSING, SUCCESS, FAILED]
        importError:
          description: Why the import failed, when importStatus is FAILED.
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
        starred:
          type: boolean
        archived:
          type: boolean
        deleted:
          description: Whether the project is in the trash.
          type: boolean
        imageUrl:
          type: string
        publishmentStatus:
          $ref: "#/components/schemas/PublishmentStatus"
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectList:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        totalCount:
          description: The number of matching projects from this page on, so the full count on the first page.
          type: integer
          format: int64
        nextCursor:
          description: Pass as `cursor` to get the next page. Absent on the last page.
          type: string
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
        alias:
          type: string
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        starred:
          type: boolean
        archived:
          type: boolean
    Plugin:
      type: object
      required: [id, name, version, system, extensions]
      properties:
        id:
          description: The plugin ID. Uploaded plugins belong to one scene, so it starts with the scene ID.
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
        author:
          type: string
        system:
          description: Whether the plugin is built in. Built-in plugins cannot be uninstalled.
          type: boolean
        extensions:
          type: array
          items:
            $ref: "#/components/schemas/PluginExtension"
    PublishProjectRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/PublishmentStatus"
        alias:
          type: string
          description: Published alias. Kept when omitted.
    PublishProjectResponse:
      type: object
      required: [project]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        url:
          type: string
          description: |
            The published URL. Absent when the project is private or the
            server has no published host configured.
    Story:
      type: object
      required: [id, projectId, title, publishmentStatus, updatedAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
        publishedAlias:
          description: The alias in the story's published URL. Set once it has been published.
          type: string
        publishmentStatus:
          $ref: "#/components/schemas/PublishmentStatus"
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PublishStoryResponse:
      type: object
      required: [story]
      properties:
        story:
          $ref: "#/components/schemas/Story"
        url:
          type: string
          description: |
            The published URL. Absent when the story is private or the server
            has no published host configured.
    ImportUploadResponse:
      type: object
      required: [projectId, uploadUrl, contentType, expiresAt]
      properties:
        projectId:
          description: The project the import creates.
          type: string
        uploadUrl:
          description: Where to PUT the zip.
          type: string
        contentType:
          description: The Content-Type header the upload must send.
          type: string
        expiresAt:
          type: string
          format: date-time
    ImportChunkResponse:
      type: object
      required: [projectId, received, total, completed]
      properties:
        projectId:
          description: The project the import creates.
          type: string
        received:
          description: Chunks received so far.
          type: integer
        total:
          type: integer
        completed:
          description: True once every chunk has arrived and the import has started.
          type: boolean
    PluginExtension:
      type: object
      required: [id, type, name]
      properties:
        id:
          type: string
        type:
          description: For example `widget`, `storyBlock` or `infoboxBlock`.
          type: string
        name:
          type: string
    PluginList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Plugin"
    UploadPluginRequest:
      type: object
      required: [url]
      properties:
        url:
          description: An https URL of the plugin zip.
          type: string
